<article
    class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl hover:-translate-y-1 transition-all duration-200">
    <img class="w-full h-48 object-cover bg-gray-100" [src]="cubo.imagen" [alt]="'Imagen de ' + cubo.nombre"
        loading="lazy">
    <div class="p-4">
        <h2 class="mb-2 text-lg font-semibold text-gray-900">{{ cubo.nombre }}</h2>
        <p class="text-xl font-bold text-green-700">{{ cubo.precio | currency:'EUR':'symbol':'1.2-2' }}</p>

        @if(!isSelected) {
            <button type="button" (click)="seleccionarFav()" class="mt-4 inline-flex items-center gap-2 rounded-lg bg-amber-400 px-4 py-2 text-sm font-semibold text-amber-950 shadow-sm transition hover:bg-amber-500 hover:shadow-md focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-500 focus-visible:ring-offset-2">
                <span aria-hidden="true">★</span>
                Seleccionar como favorito
            </button>
        }
    </div>
</article>
