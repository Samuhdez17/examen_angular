<section class="mx-auto my-12 w-full max-w-lg rounded-2xl border border-slate-200 bg-white p-8 shadow-xl shadow-slate-200/60">
  <div class="mb-8 text-center">
    <span class="mb-4 inline-flex h-12 w-12 items-center justify-center rounded-2xl bg-gradient-to-br from-fuchsia-500 to-indigo-600 text-xl font-bold text-white shadow-lg shadow-indigo-500/25">✦</span>
    <h1 class="text-2xl font-bold tracking-tight text-slate-900">Crea tu cuenta</h1>
    <p class="mt-2 text-sm text-slate-500">Únete y empieza a explorar</p>
  </div>

  <form #formLogin="ngForm" class="space-y-5">
    <div class="grid gap-5 sm:grid-cols-2">
      <div>
        <label for="id" class="mb-1.5 block text-sm font-semibold text-slate-700">Id</label>
        <input id="id" type="text" required name="id" #id
          class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-sm outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-500/10">
      </div>
      <div>
        <label for="nombre" class="mb-1.5 block text-sm font-semibold text-slate-700">Nombre</label>
        <input id="nombre" type="text" required name="nombre" #nombre autocomplete="username"
          class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-sm outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-500/10">
      </div>
    </div>

    <div>
      <label for="correo" class="mb-1.5 block text-sm font-semibold text-slate-700">Correo electrónico</label>
      <input id="correo" type="email" required name="correo" #correo autocomplete="email" placeholder="tu@correo.com"
        class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-sm outline-none transition placeholder:text-slate-400 focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-500/10">
    </div>

    <div>
      <label for="contrasenia" class="mb-1.5 block text-sm font-semibold text-slate-700">Contraseña</label>
      <input id="contrasenia" type="password" required name="contrasenia" #contrasenia autocomplete="new-password"
        class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-sm outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-500/10">
    </div>

    <button type="button" (click)="crearCuenta()"
      class="w-full rounded-xl bg-gradient-to-r from-fuchsia-600 to-indigo-600 px-5 py-3 text-sm font-bold text-white shadow-lg shadow-indigo-500/20 transition duration-200 hover:-translate-y-0.5 hover:from-fuchsia-700 hover:to-indigo-700 hover:shadow-xl focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-indigo-500/30">
      Crear cuenta
    </button>
  </form>

  <p class="mt-6 text-center text-sm text-slate-500">¿Ya tienes cuenta?
    <a routerLink="/login" class="font-semibold text-indigo-700 hover:text-fuchsia-700">Iniciar sesión</a>
  </p>
</section>
