<nav class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <!-- Lado izquierdo: Home y Marcas -->
            <div class="flex items-center space-x-4">
                <a routerLink="/" routerLinkActive="bg-gray-100 text-gray-900"
                    [routerLinkActiveOptions]="{ exact: true }"
                    class="text-gray-700 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium transition-colors duration-150">
                    Home
                </a>
                
                <a routerLink="/pedido" routerLinkActive="bg-gray-100 text-gray-900" [routerLinkActiveOptions]="{ exact: true }"
                    class="text-gray-700 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium transition-colors duration-150">
                    Realizar pedido
                </a>

                <!-- DROPDOWN -->
                <ul class="flex items-center gap-4">
                    <li class="relative">
                        <details #dropdownMarca class="group">
                            <summary
                                class="flex cursor-pointer list-none items-center gap-2 rounded-md border border-gray-300 bg-white px-3 py-2 text-sm text-gray-700 hover:bg-gray-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 [&::-webkit-details-marker]:hidden">
                                <span>Marcas</span>
                                <svg class="h-4 w-4 transition-transform group-open:rotate-180" viewBox="0 0 20 20" fill="none" stroke="currentColor"
                                    stroke-width="1.5" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="m6 8 4 4 4-4" />
                                </svg>
                            </summary>
                
                            <ul
                                class="absolute left-0 z-50 mt-1 max-h-64 w-48 overflow-y-auto rounded-md border border-gray-200 bg-white py-1 shadow-lg">
                                @for (marca of marcas; track marca) {
                                <li>
                                    <a [routerLink]="['/marca', marca]" (click)="dropdownMarca.open = false" class="block px-3 py-2 text-sm hover:bg-gray-100">
                                        {{ marca }}
                                    </a>
                                </li>
                                }
                            </ul>
                        </details>
                    </li>
                </ul>
            </div>

            <!-- Lado derecho: sesión -->
            <div class="flex items-center space-x-3">
                @if (perfil(); as usuario) {
                    <a [routerLink]="['/perfil']" class="text-sm text-gray-700 font-medium">{{ usuario.nombre }}</a>
                    <button type="button" (click)="logout()"
                        class="text-gray-700 hover:text-gray-900 px-3 py-1.5 text-sm font-medium rounded-md transition-colors duration-150 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        Cerrar sesión
                    </button>
                } @else {
                    <a routerLink="/login"
                        class="text-gray-700 hover:text-gray-900 px-3 py-1.5 text-sm font-medium rounded-md transition-colors duration-150 hover:bg-gray-100">
                        Iniciar sesión
                    </a>
                    <a routerLink="/signin"
                        class="bg-blue-600 text-white px-4 py-1.5 text-sm font-medium rounded-md transition-colors duration-150 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                        Crear cuenta
                    </a>
                }
            </div>
        </div>
    </div>
</nav>
