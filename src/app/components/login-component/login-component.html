<section class="mx-auto my-12 w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-xl shadow-slate-200/60">
  <div class="mb-8 text-center">
    <span class="mb-4 inline-flex h-12 w-12 items-center justify-center rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-600 text-xl font-bold text-white shadow-lg shadow-blue-500/25">↗</span>
    <h1 class="text-2xl font-bold tracking-tight text-slate-900">Inicia sesión</h1>
    <p class="mt-2 text-sm text-slate-500">Accede a tu cuenta para continuar</p>
  </div>

  <form #formLogin="ngForm" class="space-y-5">
    <div>
      <label for="correo" class="mb-1.5 block text-sm font-semibold text-slate-700">Correo electrónico</label>
      <input id="correo" type="email" required name="correo" #correo autocomplete="email"
        placeholder="tu@correo.com"
        class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10">
    </div>

    <div>
      <label for="contrasenia" class="mb-1.5 block text-sm font-semibold text-slate-700">Contraseña</label>
      <input id="contrasenia" type="password" required name="contrasenia" #contrasenia autocomplete="current-password"
        placeholder="Tu contraseña"
        class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10">
    </div>

    <button type="button" (click)="login()"
      class="w-full rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 px-5 py-3 text-sm font-bold text-white shadow-lg shadow-blue-500/20 transition duration-200 hover:-translate-y-0.5 hover:from-blue-700 hover:to-indigo-700 hover:shadow-xl focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-blue-500/30">
      Iniciar sesión
    </button>
  </form>

  <p class="mt-6 text-center text-sm text-slate-500">¿Aún no tienes cuenta?
    <a routerLink="/signin" class="font-semibold text-blue-700 hover:text-indigo-700">Crear cuenta</a>
  </p>
</section>
