<h1 class="p-4 text-2xl font-bold text-gray-800">Cubos de la marca {{marca}}</h1>

<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 p-4">
    @for (cubo of cubos; track cubo.idCubo) {
    <article
        class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl hover:-translate-y-1 transition-all duration-200">
        <img class="w-full h-48 object-cover bg-gray-100" [src]="cubo.imagen" [alt]="'Imagen de ' + cubo.nombre"
            loading="lazy">
        <div class="p-4">
            <h2 class="mb-2 text-lg font-semibold text-gray-900">{{ cubo.nombre }}</h2>
            <p class="text-xl font-bold text-green-700">{{ cubo.precio | currency:'EUR':'symbol':'1.2-2' }}</p>
        </div>
    </article>
    }
</div>
