<h1 class="p-4 text-2xl font-bold text-gray-800">Cubos de rubik</h1>

@if (cuboSeleccionado) {
    <div class="w-full max-w-sm p-3">
        <h2 class="mb-2 text-lg font-semibold text-gray-900">Cubo favorito: {{ cuboSeleccionado.nombre }}</h2>
        <app-cubo-component [cubo]="cuboSeleccionado" [isSelected]="true" />
    </div>
}

<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 p-4">
    @for (cubo of cubos; track cubo.idCubo) {
        <app-cubo-component [cubo]="cubo" (metodoPadre)="seleccionarFav($event)"/>
    }
</div>
